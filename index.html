<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resident Building Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-white font-sans pb-10">

  <!-- Header -->
  <nav class="bg-gray-800 p-4 border-b border-gray-700 flex justify-between items-center">
    <h1 class="text-xl font-bold text-indigo-400">Building Manager</h1>
    <span id="userInfo" class="text-xs bg-gray-700 px-2 py-1 rounded">Not Logged In</span>
  </nav>

  <div class="max-w-md mx-auto p-4 space-y-6">

    <!-- Financial Summary Card (Credit Card App Vibe) -->
    <div class="bg-gradient-to-r from-gray-800 to-gray-900 border border-gray-700 rounded-2xl p-5 shadow-2xl space-y-4">
      <div class="flex justify-between items-center">
        <span class="text-xs text-gray-400 uppercase tracking-widest">Monthly Overview</span>
        <span class="text-xs bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-full">Sep 2026</span>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <p class="text-xs text-gray-400">Total Collected</p>
          <p id="totalCollected" class="text-lg font-bold text-emerald-400">$0</p>
        </div>
        <div>
          <p class="text-xs text-gray-400">Total Spent</p>
          <p id="totalSpent" class="text-lg font-bold text-rose-400">$0</p>
        </div>
      </div>

      <hr class="border-gray-800">

      <div class="flex justify-between items-center">
        <span class="text-sm font-medium">Net Surplus / Deficit:</span>
        <span id="netBalance" class="text-xl font-black text-emerald-400">$0</span>
      </div>
    </div>

    <!-- Registration Box -->
    <div class="bg-gray-800 p-5 rounded-2xl border border-gray-700 space-y-3">
      <h2 class="text-md font-bold text-gray-200">Resident Registration</h2>
      <input id="fullName" type="text" placeholder="Full Name" class="w-full p-2 text-sm bg-gray-900 rounded border border-gray-700">
      <input id="email" type="email" placeholder="Email Address" class="w-full p-2 text-sm bg-gray-900 rounded border border-gray-700">
      <div class="flex gap-2">
        <select id="floorNo" class="w-1/2 p-2 text-sm bg-gray-900 rounded border border-gray-700">
          <option value="">Floor</option>
          <option value="1">Floor 1</option>
          <option value="2">Floor 2</option>
          <option value="3">Floor 3</option>
          <option value="4">Floor 4</option>
          <option value="5">Floor 5</option>
        </select>
        <input id="unitNo" type="text" placeholder="Unit (e.g. 302)" class="w-1/2 p-2 text-sm bg-gray-900 rounded border border-gray-700">
      </div>
      <input id="password" type="password" placeholder="Password" class="w-full p-2 text-sm bg-gray-900 rounded border border-gray-700">
      <button onclick="registerUser()" class="w-full bg-indigo-600 hover:bg-indigo-500 py-2 rounded text-sm font-bold">Register Account</button>
    </div>

    <!-- Expense Log Section -->
    <div class="bg-gray-800 p-5 rounded-2xl border border-gray-700 space-y-3">
      <h2 class="text-md font-bold text-gray-200">Recent Spends & Invoices</h2>
      <div id="expenseList" class="space-y-2 text-xs">
        <p class="text-gray-500">Loading building expense history...</p>
      </div>
    </div>

  </div>

  <script>
    // Paste your Google Apps Script Web App URL here
    const API_URL = "https://script.google.com/macros/s/AKfycbxG7BIVk0EbLUD8rv8tnu0ucGVVBXzWj22RyZh7o5YtenAnb45qQd501TUrfqj4vTJG6w/exec";

    async function loginUser() {
  const payload = {
    action: "login",
    email: document.getElementById("loginEmail").value,
    password: document.getElementById("loginPassword").value
  };

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    });
    const result = await res.json();
    
    if (result.status === "success") {
      document.getElementById("userInfo").innerText = result.user.fullName + " (" + result.user.unitNo + ")";
      alert("Login successful!");
      loadDashboard();
    } else {
      alert(result.message || "Login failed.");
    }
  } catch (err) {
    console.error("Login Error:", err);
    alert("Could not complete login.");
  }
}

async function registerUser() {
  const payload = {
    action: "register",
    fullName: document.getElementById("fullName").value,
    email: document.getElementById("email").value,
    floorNo: document.getElementById("floorNo").value,
    unitNo: document.getElementById("unitNo").value,
    password: document.getElementById("password").value
  };

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      body: JSON.stringify(payload)
    });
    const result = await res.json();
    alert(result.message);
  } catch (err) {
    console.error("Registration Error:", err);
  }
}
    async function registerUser() {
      const payload = {
        action: "register",
        fullName: document.getElementById("fullName").value,
        email: document.getElementById("email").value,
        floorNo: document.getElementById("floorNo").value,
        unitNo: document.getElementById("unitNo").value,
        password: document.getElementById("password").value
      };

      const res = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });
      const result = await res.json();
      alert(result.message);
    }

    // Initial load
    loadDashboard();
  </script>
</body>
</html>
